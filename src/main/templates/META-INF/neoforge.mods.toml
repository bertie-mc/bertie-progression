# Every mod whose data/<ns>/ we OVERRIDE needs ordering="AFTER" here, or its own file wins and the
# override silently does nothing - no error, no log line. Mod datapacks are ordered by mod load
# order, which ties-breaks alphabetically by modId, so any modId sorting AFTER "bertie_s1" beats us
# unless it is listed here. (deepwaters lost exactly this way: berlord 2026-07-29, the 2x2 Block of
# Flaming Opal recipe shipped and changed nothing in game.)
[[dependencies.${mod_id}]]
modId="deepwaters"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

# We now override data/cataclysm/recipe/*_eye.json. It currently sorts before us anyway, but that is
# incidental - declare it so a future pack reshuffle cannot silently revert the override.
[[dependencies.${mod_id}]]
modId="cataclysm"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
